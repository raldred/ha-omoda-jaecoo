[project]
name = "jaecoo-api-probe"
version = "0.1.0"
description = "Read-only EU Omoda/Jaecoo account and vehicle telemetry probe"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.5,<3", "cryptography>=46,<49", "aiohttp>=3.12,<4", "Pillow>=11,<13", "phonenumbers==9.0.40"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["tests/ha", ".venv", ".git", "analysis", "JaecooApps"]
