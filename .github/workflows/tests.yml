name: Offline tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run pytest -q

  home-assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/ha
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest -q

  home-assistant-compatibility:
    runs-on: ubuntu-latest
    env:
      HA_TEST_VERSION: "2026.7.1"
      HA_TEST_PLUGIN_VERSION: "0.13.345"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: >-
          uv run --no-project --python 3.14
          --with pytest-homeassistant-custom-component==0.13.345
          --with phonenumbers==9.0.40
          pytest -c tests/ha/pyproject.toml -q tests/ha
