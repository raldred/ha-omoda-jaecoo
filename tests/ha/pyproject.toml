[project]
name = "omoda-jaecoo-ha-tests"
version = "0.1.0"
description = "Offline native Home Assistant integration tests"
requires-python = ">=3.14.2,<3.15"
dependencies = [
  "pytest-homeassistant-custom-component==0.13.367",
  "cryptography==48.0.1",
  "phonenumbers==9.0.40",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../.."]
addopts = "--disable-socket --allow-unix-socket"
asyncio_mode = "auto"
